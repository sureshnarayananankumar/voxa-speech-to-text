# Render Blueprint: deploys the whole stack (Postgres + STT service + API gateway + Angular UI).
# Free instances cannot receive private-network traffic, so services talk over their public URLs.
databases:
  - name: voxa-db
    plan: free
    databaseName: stt
    user: stt

services:
  - type: web
    name: voxa-stt
    runtime: docker
    plan: free
    rootDir: stt-service
    healthCheckPath: /health
    envVars:
      - key: STT_PROVIDER
        value: browser          # browser (Chrome/Edge Web Speech, no key) | openai (needs OPENAI_API_KEY) | whisper | gemini | mock
      - key: OPENAI_API_KEY
        sync: false             # set in the Render dashboard
      - key: WHISPER_MODEL
        value: tiny             # only used when STT_PROVIDER=whisper
      - key: GEMINI_API_KEY
        sync: false             # optional: set in the Render dashboard if STT_PROVIDER=gemini

  - type: web
    name: voxa-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voxa-db
          property: connectionString
      - key: STT_URL
        value: https://voxa-stt.onrender.com

  - type: web
    name: voxa
    runtime: docker
    plan: free
    rootDir: frontend
    envVars:
      - key: BACKEND_URL
        value: https://voxa-backend-lntg.onrender.com
